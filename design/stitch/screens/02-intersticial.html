<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortURL2 — Intersticial de destino (/go/:code)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-900: #0E0F0C;
      --ink-800: #141611;
      --ink-700: #1B1E17;
      --line: #262A22;
      --line-strong: #3A4033;
      --bone: #EDEEE6;
      --sage: #A8B39C;
      --sage-dim: #8A9680;
      --lime: #C8F751;
      --lime-ink: #0E0F0C;
      --rust: #E2543A;
      --amber: #E8A33D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ink-900);
      color: var(--bone);
      font-family: 'Instrument Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle editorial film grain overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 99;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      background-color: var(--ink-800);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    /* 1. Micro amber notice */
    .notice-label {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 12px;
    }

    /* 2. Display Title */
    .title {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      line-height: 1.10;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--bone);
      margin-bottom: 24px;
    }

    /* 3. Destination Strip */
    .destination-strip {
      background-color: var(--ink-700);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      line-height: 1.40;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
      margin-bottom: 16px;
    }

    .host {
      color: var(--bone);
      font-weight: 500;
    }

    .path {
      color: var(--sage);
      font-weight: 400;
    }

    /* 4. Warning disclaimer paragraph */
    .disclaimer {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
      color: var(--sage);
      max-width: 480px;
      margin-bottom: 32px;
    }

    /* 5. Button row */
    .button-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      height: 40px;
      border-radius: 8px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
    }

    .btn:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: var(--lime);
      color: var(--lime-ink);
      border: 1px solid transparent;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--bone);
      border: 1px solid var(--line-strong);
    }

    .btn-secondary:hover {
      background-color: var(--ink-700);
      border-color: var(--line-strong);
    }

    /* 6. Hairline & Meta */
    .divider {
      height: 1px;
      background-color: var(--line);
      width: 100%;
      margin-bottom: 16px;
    }

    .meta-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.40;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      color: var(--sage-dim);
    }

    /* Footer link below card */
    .footer-action {
      display: flex;
      justify-content: center;
    }

    .report-link {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
      color: var(--sage-dim);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 150ms ease;
      cursor: pointer;
    }

    .report-link:hover {
      color: var(--sage);
    }

    .report-link:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main class="container">
    <article class="card">
      <!-- 1. Micro uppercase notice -->
      <span class="notice-label">VAS A SALIR DE SHORTURL</span>

      <!-- 2. Display Title -->
      <h1 class="title">Este link te lleva a</h1>

      <!-- 3. Destination Strip -->
      <div class="destination-strip">
        <span class="host">ejemplo.com</span><span class="path">/blog/como-acortar-urls</span>
      </div>

      <!-- 4. Disclaimer Paragraph -->
      <p class="disclaimer">
        No podemos verificar el contenido del destino. Si no esperabas este link, cerralo.
      </p>

      <!-- 5. Button Row -->
      <div class="button-row">
        <a href="https://ejemplo.com/blog/como-acortar-urls" class="btn btn-primary" rel="nofollow noopener noreferrer">Continuar</a>
        <a href="javascript:history.back()" class="btn btn-secondary">Volver</a>
      </div>

      <!-- 6. Hairline separator & Meta line -->
      <div class="divider" role="separator"></div>
      <div class="meta-line">
        Creado hace 3 días · expira en 27 días
      </div>
    </article>

    <!-- Footer Report Link -->
    <footer class="footer-action">
      <a href="#reportar" class="report-link">Reportar este link</a>
    </footer>
  </main>
</body>
</html>
